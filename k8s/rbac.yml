apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-sa
  namespace: session-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: router-sa
  namespace: session-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-sa
  namespace: session-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: session-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-role
  namespace: session-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-rb
  namespace: session-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-role
subjects:
  - kind: ServiceAccount
    name: operator-sa
    namespace: session-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-role
  namespace: session-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-rb
  namespace: session-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-role
subjects:
  - kind: ServiceAccount
    name: router-sa
    namespace: session-system
